<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Tax Assistant{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: Canvas; color: CanvasText; }
  header { display: flex; align-items: baseline; gap: 1rem; padding: .75rem 1.25rem;
           border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); flex-wrap: wrap; }
  header .brand { font-weight: 700; }
  header a { text-decoration: none; }
  main { max-width: 72rem; margin: 0 auto; padding: 1.25rem; }
  table { border-collapse: collapse; width: 100%; margin: .75rem 0; }
  th, td { text-align: left; padding: .4rem .6rem;
           border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent); }
  th { font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; opacity: .7; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: .05rem .5rem; border-radius: 999px;
          background: color-mix(in srgb, CanvasText 10%, transparent); font-size: .85rem; }
  .muted { opacity: .65; }
  .warn { color: #b45309; }
  input, select, textarea, button {
    font: inherit; padding: .35rem .5rem; border-radius: 6px;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
    background: Field; color: FieldText; max-width: 100%;
  }
  button { cursor: pointer; font-weight: 600; }
  form.edit { display: grid; gap: .6rem; max-width: 26rem; }
  form.edit label { display: grid; gap: .15rem; font-size: .85rem; }
  .flash { padding: .5rem .75rem; border-radius: 6px; margin: .5rem 0;
           background: color-mix(in srgb, green 15%, Canvas); }
  .flash.error { background: color-mix(in srgb, red 15%, Canvas); }
  .cols { display: flex; gap: 2rem; flex-wrap: wrap; align-items: flex-start; }
  .cols > * { flex: 1 1 22rem; min-width: 0; }
  img.receipt { max-width: 100%; border-radius: 8px;
                border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  h1 { font-size: 1.4rem; } h2 { font-size: 1.1rem; }
</style>
</head>
<body>
<header>
  <span class="brand">🧾 Tax Assistant</span>
  {% for y in years %}<a href="/year/{{ y }}">{{ y }}</a>{% endfor %}
  <a href="/quarantine">Quarantine</a>
  <span style="margin-left:auto"><a href="/logout" class="muted">Log out</a></span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
